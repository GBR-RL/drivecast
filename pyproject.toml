[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "drivecast"
version = "0.1.0"
description = "Predicting hard-drive failures in the Backblaze fleet: a data and MLOps pipeline"
readme = "README.md"
license = "MIT"
authors = [{ name = "Rohiith Gettala Balachandar" }]
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas-stubs"]
survival = ["lifelines>=0.29", "scipy>=1.11"]

[project.scripts]
drivecast = "drivecast.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/drivecast"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT", "RET", "C4"]
ignore = ["PLR0913", "PLR2004", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["drivecast"]

[tool.ruff.lint.per-file-ignores]
"src/drivecast/cli.py" = ["PLR0917"]  # Typer maps parameters to CLI flags

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["src/drivecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
