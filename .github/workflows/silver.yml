name: Silver

# Silver layer: the drive table is built from all of bronze (read in place from the lake release
# over HTTP), then every quarter is written by its own runner and stored as an asset of the silver
# release. On pull requests that touch it, the 2013 quarters are built without uploading.
on:
  workflow_dispatch:
    inputs:
      quarters:
        description: Comma-separated quarters (e.g. 2016Q1,2016Q2), or "all"
        default: all
      lake:
        description: Release that holds the bronze lake
        default: lake-v1
      release:
        description: Release that holds the silver layer
        default: silver-v1
  workflow_call:
    inputs:
      quarters:
        description: Comma-separated quarters, or all
        type: string
        default: "all"
      lake:
        description: Release that holds the bronze lake
        type: string
        default: "lake-v1"
      release:
        description: Release that holds the silver layer
        type: string
        default: "silver-v1"
      latest:
        description: Newest published quarter, when newer than the code knows (e.g. 2026Q3)
        type: string
        default: ""
  pull_request:
    paths:
      - "src/drivecast/lake/silver.py"
      - ".github/workflows/silver.yml"

permissions:
  contents: write

env:
  DRIVECAST_LATEST: ${{ inputs.latest }}
  LAKE: ${{ inputs.lake || 'lake-v1' }}
  RELEASE: ${{ inputs.release || 'silver-v1' }}
  PR: ${{ github.event_name == 'pull_request' }}

jobs:
  drives:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      quarters: ${{ steps.plan.outputs.quarters }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --quiet -e .
      - id: plan
        env:
          WANTED: ${{ github.event_name == 'pull_request' && '2013Q2,2013Q3,2013Q4' || inputs.quarters }}
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          from drivecast.lake.silver import quarters
          names = quarters()
          wanted = os.environ["WANTED"].strip()
          chosen = names if wanted == "all" else [q.strip() for q in wanted.split(",")]
          assert set(chosen) <= set(names), sorted(set(chosen) - set(names))
          print("quarters=" + json.dumps(chosen))
          EOF
      - name: Drive table
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PR" = true ]; then
            gh release download "$LAKE" --pattern 'drive_stats_2013-*.parquet' --dir bronze
            LAKE_ARG=bronze
          else
            LAKE_ARG="release:$LAKE"
          fi
          drivecast drives --lake "$LAKE_ARG" --out drives.parquet --threads 4 --memory-limit 12GB
      - name: Store it with the silver layer
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE" >/dev/null 2>&1 || gh release create "$RELEASE" \
            --target "$GITHUB_SHA" --latest=false --title "Lake: silver ($RELEASE)" \
            --notes "Data drives only, one row per drive and day, with the data-quality rules applied (see src/drivecast/lake/silver.py), one Parquet file per quarter, plus the drive table. Built from the bronze release $LAKE by the Silver workflow. Source: Backblaze, https://www.backblaze.com/cloud-storage/resources/hard-drive-test-data."
          gh release upload "$RELEASE" drives.parquet --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: drives
          path: drives.parquet
          retention-days: 7

  silver:
    needs: drives
    name: Silver ${{ matrix.quarter }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        quarter: ${{ fromJSON(needs.drives.outputs.quarters) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --quiet -e .
      - uses: actions/download-artifact@v4
        with:
          name: drives
      - name: Build the quarter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PR" = true ]; then
            gh release download "$LAKE" --pattern 'drive_stats_2013-*.parquet' --dir bronze
            LAKE_ARG=bronze
          else
            LAKE_ARG="release:$LAKE"
          fi
          drivecast silver "${{ matrix.quarter }}" --lake "$LAKE_ARG" --drives drives.parquet \
            --out out --threads 4 --memory-limit 12GB
      - name: Upload the quarter
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            gh release upload "$RELEASE" out/silver_*.parquet out/silver_*.json --clobber && break
            sleep $((attempt * 30))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: silver-${{ matrix.quarter }}
          path: out/silver_*.json
          retention-days: 30
