name: Sequence model

# A GRU over each drive's last 30 days, fitted like the backtest models (four quarters before the
# test quarter, 30-day embargo) and compared with them on weekly checks of every drive. 2015Q2
# was used to settle the class weighting, so the comparison runs on the second quarter of each
# later year. On pull requests that touch it, 2015Q2 is run.
on:
  workflow_dispatch:
    inputs:
      quarters:
        description: Comma-separated test quarters
        default: 2016Q2,2017Q2,2018Q2,2019Q2,2020Q2,2021Q2,2022Q2,2023Q2,2024Q2,2025Q2,2026Q2
  pull_request:
    paths:
      - "src/drivecast/models/sequence.py"
      - ".github/workflows/sequence.yml"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      quarters: ${{ steps.plan.outputs.quarters }}
    steps:
      - id: plan
        env:
          WANTED: ${{ github.event_name == 'pull_request' && '2015Q2' || inputs.quarters }}
        run: python3 -c "import json, os; print('quarters=' + json.dumps([q.strip() for q in os.environ['WANTED'].split(',')]))" >> "$GITHUB_OUTPUT"

  sequence:
    needs: plan
    name: GRU ${{ matrix.quarter }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        quarter: ${{ fromJSON(needs.plan.outputs.quarters) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet -e ".[models,sequence]"
      - name: Download silver, training samples and backtest scores
        env:
          GH_TOKEN: ${{ github.token }}
          Q: ${{ matrix.quarter }}
        run: |
          read -r -a train <<< "$(python -c "from drivecast.models.backtest import train_quarters; print(' '.join(train_quarters('$Q')))")"
          prev=$(python -c "from drivecast.features.build import previous_quarter as p; print(p('${train[0]}'), p('$Q'))")
          silver=(--pattern drives.parquet --pattern "silver_$Q.parquet")
          for q in "${train[@]}" $prev; do silver+=(--pattern "silver_$q.parquet"); done
          gh release download silver-v1 --dir silver "${silver[@]}" || true
          gold=()
          for q in "${train[@]}"; do gold+=(--pattern "train_$q.parquet"); done
          gh release download gold-v1 --dir gold "${gold[@]}"
          gh release download backtest-v1 --dir backtest --pattern "scores_$Q.parquet"
          ls -la silver gold backtest
      - name: Fit and compare
        run: |
          drivecast sequence "${{ matrix.quarter }}" --gold gold --silver silver \
            --scores "backtest/scores_${{ matrix.quarter }}.parquet" --out out --threads 4
      - uses: actions/upload-artifact@v4
        with:
          name: sequence-${{ matrix.quarter }}
          path: out/sequence_*.json
          retention-days: 90
