name: Backtest

# Rolling-origin backtest: for every test quarter, the models are fitted on the four quarters
# before it (with a 30-day embargo) and evaluated on every drive and day of it. One runner per
# test quarter; the results and the scores are stored as assets of the backtest release and the
# per-quarter results are summarised. On pull requests that touch the models, 2015Q2 is run.
on:
  workflow_dispatch:
    inputs:
      quarters:
        description: Comma-separated test quarters, or "all" (2015Q2 to the latest)
        default: all
      gold:
        description: Release that holds the gold layer
        default: gold-v1
      release:
        description: Release that holds the backtest results
        default: backtest-v1
  pull_request:
    paths:
      - "src/drivecast/models/**"
      - ".github/workflows/backtest.yml"

permissions:
  contents: write

env:
  GOLD: ${{ inputs.gold || 'gold-v1' }}
  RELEASE: ${{ inputs.release || 'backtest-v1' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      quarters: ${{ steps.plan.outputs.quarters }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --quiet -e .
      - id: plan
        env:
          WANTED: ${{ github.event_name == 'pull_request' && '2015Q2' || inputs.quarters }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from drivecast.models.backtest import backtest_quarters
          names = backtest_quarters()
          wanted = os.environ["WANTED"].strip()
          chosen = names if wanted == "all" else [q.strip() for q in wanted.split(",")]
          assert set(chosen) <= set(names), sorted(set(chosen) - set(names))
          print("quarters=" + json.dumps(chosen))
          PY
      - name: Create the release that holds the results
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE" >/dev/null 2>&1 || gh release create "$RELEASE" \
            --target "$GITHUB_SHA" --latest=false --title "Backtest ($RELEASE)" \
            --notes "Rolling-origin backtest of the failure-prediction models: per test quarter, the evaluation (backtest_<quarter>.json) and every score (scores_<quarter>.parquet). Built from the gold release $GOLD by the Backtest workflow."

  backtest:
    needs: plan
    name: Test ${{ matrix.quarter }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        quarter: ${{ fromJSON(needs.plan.outputs.quarters) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --quiet -e ".[models]"
      - name: Download the gold files
        env:
          GH_TOKEN: ${{ github.token }}
          Q: ${{ matrix.quarter }}
        run: |
          patterns=(--pattern "features_$Q.parquet")
          for q in $(python -c "from drivecast.models.backtest import train_quarters; print(' '.join(train_quarters('$Q')))"); do
            patterns+=(--pattern "train_$q.parquet")
          done
          gh release download "$GOLD" --dir gold "${patterns[@]}"
          ls -la gold
      - name: Fit and evaluate
        run: drivecast backtest "${{ matrix.quarter }}" --gold gold --out out --threads 4
      - name: Store the results
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            gh release upload "$RELEASE" out/* --clobber && break
            sleep $((attempt * 30))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ matrix.quarter }}
          path: out/backtest_*.json
          retention-days: 90

  summary:
    needs: backtest
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --quiet -e ".[models]"
      - uses: actions/download-artifact@v4
        with:
          pattern: backtest-*
          merge-multiple: true
          path: results
      - run: drivecast backtest-summary results/backtest_*.json --out backtest.json
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-summary
          path: backtest.json
          retention-days: 90
