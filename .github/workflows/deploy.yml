name: Deploy

# Builds the service image with the champion model (resolved from the MLflow store in the MLOps
# release, or the latest fitted LightGBM before the store exists), deploys it to a kind cluster
# with the manifests in deploy/k8s, and smoke- and load-tests it there. On main the image is
# pushed to the GitHub Container Registry.
on:
  push:
    branches: [main]
    paths:
      - "src/drivecast/serve/**"
      - "src/drivecast/features/build.py"
      - "Dockerfile"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "src/drivecast/serve/**"
      - "src/drivecast/features/build.py"
      - "Dockerfile"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/gbr-rl/drivecast

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --quiet -e ".[serve,mlops]"
      - name: Export the champion model
        env:
          GH_TOKEN: ${{ github.token }}
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: |
          if gh release download mlops-v1 --pattern mlflow-store.tar.gz --dir . 2>/dev/null; then
            tar xzf mlflow-store.tar.gz
            gh release download mlops-v1 --dir models --pattern 'lightgbm_*.txt' --pattern 'logreg_*.joblib'
            drivecast export-champion --models models --store mlflow --out model
          else
            latest=$(gh release view mlops-v1 --json assets --jq '[.assets[].name|select(startswith("lightgbm_"))]|sort|last')
            gh release download mlops-v1 --dir models --pattern "$latest"
            drivecast export-champion --models models --out model
          fi
          cat model/metadata.json
      - name: Build the image
        run: docker build -t drivecast:ci .
      - uses: helm/kind-action@v1
        with:
          cluster_name: drivecast
      - name: Deploy to kind
        run: |
          kind load docker-image drivecast:ci --name drivecast
          kubectl apply -f deploy/k8s/
          kubectl set image deployment/drivecast api=drivecast:ci
          kubectl rollout status deployment/drivecast --timeout=180s
          kubectl get pods -o wide
      - name: Smoke and load test
        run: |
          kubectl port-forward service/drivecast 8080:80 >/tmp/port-forward.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health && break; sleep 2; done
          python deploy/smoke.py http://127.0.0.1:8080 --requests 300 --concurrency 8 \
            --summary "$GITHUB_STEP_SUMMARY" | tee smoke.json
      - name: Logs on failure
        if: failure()
        run: kubectl logs deployment/drivecast --all-containers --tail=200 || true
      - uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: smoke.json
          retention-days: 30
      - name: Push to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag drivecast:ci "$IMAGE:${GITHUB_SHA::7}"
          docker tag drivecast:ci "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
