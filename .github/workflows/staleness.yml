name: Staleness

# For every test quarter, LightGBM models deployed 0, 1, 2, 3, 4 and 8 quarters earlier and the
# models frozen at the first deployment (2015Q2) score the whole quarter; each model's drift
# from the data it was trained on is recorded. The results make every retraining policy
# computable. The quarter's freshly fitted models are kept for the model registry.
on:
  workflow_dispatch:
    inputs:
      quarters:
        description: Comma-separated test quarters, or "all" (2015Q2 to the latest)
        default: all
      gold:
        description: Release that holds the gold layer
        default: gold-v1
  pull_request:
    paths:
      - "src/drivecast/mlops/staleness.py"
      - "src/drivecast/mlops/drift.py"
      - ".github/workflows/staleness.yml"

permissions:
  contents: read

env:
  GOLD: ${{ inputs.gold || 'gold-v1' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      quarters: ${{ steps.plan.outputs.quarters }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --quiet -e .
      - id: plan
        env:
          WANTED: ${{ github.event_name == 'pull_request' && '2016Q2' || inputs.quarters }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from drivecast.models.backtest import backtest_quarters
          names = backtest_quarters()
          wanted = os.environ["WANTED"].strip()
          chosen = names if wanted == "all" else [q.strip() for q in wanted.split(",")]
          assert set(chosen) <= set(names), sorted(set(chosen) - set(names))
          print("quarters=" + json.dumps(chosen))
          PY

  staleness:
    needs: plan
    name: Ages ${{ matrix.quarter }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        quarter: ${{ fromJSON(needs.plan.outputs.quarters) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --quiet -e ".[models]"
      - name: Download the gold files
        env:
          GH_TOKEN: ${{ github.token }}
          Q: ${{ matrix.quarter }}
        run: |
          python - <<'PY' > patterns.txt
          import os
          from drivecast.mlops.staleness import AGES, FIRST_DEPLOYMENT, quarters_between, shift
          from drivecast.models.backtest import train_quarters
          q = os.environ["Q"]
          needed = {shift(q, -1), q}
          for d in [shift(q, -a) for a in AGES] + [FIRST_DEPLOYMENT]:
              if quarters_between(FIRST_DEPLOYMENT, d) >= 0:
                  needed |= set(train_quarters(d))
          print(f"features_{q}.parquet")
          for n in sorted(needed):
              print(f"train_{n}.parquet")
          PY
          args=()
          while read -r p; do args+=(--pattern "$p"); done < patterns.txt
          gh release download "$GOLD" --dir gold "${args[@]}"
          ls gold | wc -l
      - name: Score the quarter with models of every age
        run: drivecast staleness "${{ matrix.quarter }}" --gold gold --out out --threads 4
      - uses: actions/upload-artifact@v4
        with:
          name: staleness-${{ matrix.quarter }}
          path: out/
          retention-days: 90
