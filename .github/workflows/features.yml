name: Features

# Gold layer: features and labels for every drive and day, one runner per quarter, read from the
# silver release over HTTP and stored as assets of the gold release, with a training sample per
# quarter (all positives, 1% of negatives). On pull requests that touch it, 2013Q4 is built from
# the silver release without uploading.
on:
  workflow_dispatch:
    inputs:
      quarters:
        description: Comma-separated quarters (e.g. 2020Q1,2020Q2), or "all"
        default: all
      silver:
        description: Release that holds the silver layer
        default: silver-v1
      release:
        description: Release that holds the gold layer
        default: gold-v1
  workflow_call:
    inputs:
      quarters:
        description: Comma-separated quarters, or all
        type: string
        default: "all"
      silver:
        description: Release that holds the silver layer
        type: string
        default: "silver-v1"
      release:
        description: Release that holds the gold layer
        type: string
        default: "gold-v1"
      latest:
        description: Newest published quarter, when newer than the code knows (e.g. 2026Q3)
        type: string
        default: ""
  pull_request:
    paths:
      - "src/drivecast/features/**"
      - ".github/workflows/features.yml"

permissions:
  contents: write

env:
  DRIVECAST_LATEST: ${{ inputs.latest }}
  SILVER: ${{ inputs.silver || 'silver-v1' }}
  RELEASE: ${{ inputs.release || 'gold-v1' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      quarters: ${{ steps.plan.outputs.quarters }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --quiet -e .
      - id: plan
        env:
          WANTED: ${{ github.event_name == 'pull_request' && '2013Q4' || inputs.quarters }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from drivecast.lake.silver import quarters
          names = quarters()
          wanted = os.environ["WANTED"].strip()
          chosen = names if wanted == "all" else [q.strip() for q in wanted.split(",")]
          assert set(chosen) <= set(names), sorted(set(chosen) - set(names))
          print("quarters=" + json.dumps(chosen))
          PY
      - name: Create the release that holds the gold layer
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE" >/dev/null 2>&1 || gh release create "$RELEASE" \
            --target "$GITHUB_SHA" --latest=false --title "Lake: gold ($RELEASE)" \
            --notes "Features and the label 'fails within 30 days' for every drive and day (features_<quarter>.parquet), and a training sample per quarter with every positive row and 1% of negative rows, weighted (train_<quarter>.parquet). Built from the silver release $SILVER by the Features workflow. Source: Backblaze, https://www.backblaze.com/cloud-storage/resources/hard-drive-test-data."

  features:
    needs: plan
    name: Features ${{ matrix.quarter }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        quarter: ${{ fromJSON(needs.plan.outputs.quarters) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --quiet -e .
      - name: Build the quarter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$SILVER" --pattern drives.parquet --dir .
          drivecast features "${{ matrix.quarter }}" \
            --silver "https://github.com/$GITHUB_REPOSITORY/releases/download/$SILVER" \
            --drives drives.parquet --out out --threads 4 --memory-limit 12GB
          ls -la out
      - name: Upload the quarter
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            gh release upload "$RELEASE" out/*.parquet out/*.json --clobber && break
            sleep $((attempt * 30))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: features-${{ matrix.quarter }}
          path: out/*.json
          retention-days: 30
